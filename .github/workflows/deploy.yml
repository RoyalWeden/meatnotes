name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > /tmp/lfs-ids.txt
      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('/tmp/lfs-ids.txt') }}
          restore-keys: lfs-
      - name: Pull LFS objects
        id: lfs-pull
        continue-on-error: true
        run: git lfs pull
      - name: Verify LFS status
        if: steps.lfs-pull.outcome == 'failure'
        run: |
          echo "::warning::Git LFS pull failed — building with cached PDFs"
          if [ -d ".git/lfs/objects" ] && [ "$(find .git/lfs/objects -type f | head -1)" ]; then
            echo "Cached LFS objects found — PDFs from previous build will be used"
          else
            echo "::warning::No cached LFS objects — PDFs will be missing from this build"
          fi
      - name: Restore Quartz font cache
        uses: actions/cache@v6
        with:
          path: .quartz-cache/fonts
          key: quartz-fonts-${{ hashFiles('quartz.config.ts') }}
          restore-keys: quartz-fonts-
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5